name: graphql_generator3
version: 3.2.1
description: >-
  Generates graphql_schema3 types from annotated Dart classes at build time, for
  use with graphql_server3. A build-time dependency only.
homepage: https://github.com/raphrmx/graphql_generator3
repository: https://github.com/raphrmx/graphql_generator3
issue_tracker: https://github.com/raphrmx/graphql_generator3/issues

topics:
  - graphql
  - codegen
  - build-runner

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  analyzer: ^14.3.0
  build: ^4.0.11
  code_builder: ^4.12.0
  graphql_schema3: ^3.2.0
  json_annotation: ^4.12.0
  source_gen: ^4.3.0

dev_dependencies:
  build_runner: ^2.16.1
  build_test: ^3.0.0
  lints: ^6.1.0
  test: ^1.31.0

# Uncomment while working on graphql_schema3: without this, the dependency above
# is resolved from pub.dev and local edits have no effect.
#dependency_overrides:
#  graphql_schema3:
#    path: ../graphql_schema3
