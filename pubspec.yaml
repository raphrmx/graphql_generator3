name: graphql_generator3
version: 3.2.0
description: Generates GraphQL schemas from Dart classes, for use with pkg:graphql_server3.
homepage: https://github.com/raphrmx/graphql_generator3
repository: https://github.com/raphrmx/graphql_generator3
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  analyzer: ^14.3.0
  graphql_schema3:
    git: https://github.com/raphrmx/graphql_schema3.git
  build: ^4.0.11
  json_annotation: ^4.12.0
  code_builder: ^4.12.0
  source_gen: ^4.3.0

dev_dependencies:
  build_runner: ^2.16.1
  build_test: ^3.0.0
  lints: ^6.1.0
  test: ^1.31.0

